<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Laiba Ashfaq</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html">Laiba Ashfaq</a>
<nav class="menu">
<a href="index.html">Home</a>
<a href="timetable.html">Timetable</a>
<a href="contact.html">Contact</a>
</nav>
</header>
<main>
<h1>Contact me</h1>
<form method="get">
<label for="name">Your name</label>
<input type="text" id="name" name="name" placeholder="Laiba Ashfaq" required>

<label for="email">Email</label>
<input type="email" id="email" name="email" required>

<label for="topic">Topic</label>
<select id="topic" name="topic">
<option value="project">New project</option>
<option value="job">Job or internship</option>
<option value="other">Something else</option>
</select>

<p style="margin-top:16px;font-weight:500">How should I reply?</p>
<input type="radio" id="reply-email" name="reply" value="email">
<label for="reply-email" style="display:inline;margin-right:14px">By Email</label>
<input type="radio" id="reply-phone" name="reply" value="phone">
<label for="reply-phone" style="display:inline">By Phone</label>

<label for="message" style="margin-top:16px">Message</label>
<textarea id="message" name="message" rows="5"></textarea>

<div style="margin-top:14px">
<input type="checkbox" id="consent" name="consent" required>
<label for="consent" style="display:inline">I consent to my data being used for contact</label>
</div>

<button type="submit">Send message</button>
</form>
</main>
</body>
</html>
